name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Syntax-check server files
        working-directory: server
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

      # Add real tests here once you write them, e.g.:
      # - name: Run tests
      #   working-directory: server
      #   run: npm test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Build client
        working-directory: client
        run: npm run build

  # Builds the sandbox Docker images to make sure the Dockerfiles stay valid.
  # Add a real "docker push" + deploy step here once you have a registry/host set up.
  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build python sandbox image
        run: docker build -t sandbox-python server/sandbox/images/python-sandbox

      - name: Build node sandbox image
        run: docker build -t sandbox-node server/sandbox/images/node-sandbox
